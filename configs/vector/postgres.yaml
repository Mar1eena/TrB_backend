# PostgreSQL logs:
#   jsonlog (postgre-1c-db) → OTLP → default.otel_logs → HyperDX :8080
#   same events, typed → postgres.logs / query_plans / errors in ClickHouse
#
# HyperDX attributes observed in otel_logs.LogAttributes:
#   pid, error_severity, backend_type, remote_host, dbname, user, command_tag,
#   query_id, duration_ms, event=auto_explain, query_plan, detail, context,
#   application_name, pg_message, state_code, hint

sources:
  postgres_1c_json:
    type: file
    include:
      - /var/log/postgresql-1c/*.json
      - /var/log/postgresql-1c/*.log.json
    read_from: end
    glob_minimum_cooldown_ms: 2000

transforms:
  # Flatten PG jsonlog into typed fields (shared by OTLP + ClickHouse).
  postgres_1c_parsed:
    type: remap
    inputs: [postgres_1c_json]
    source: |
      raw = string(.message) ?? ""
      ts = .timestamp
      service = "postgre-1c-db"
      severity = "INFO"
      severity_number = 9
      severity_pg = "LOG"
      user = ""
      dbname = ""
      pid = 0
      application_name = ""
      backend_type = ""
      sql_state = ""
      detail = ""
      hint = ""
      query_id = ""
      remote_host = ""
      command_tag = ""
      internal_query = ""
      context = ""
      statement = ""
      msg = raw
      body = raw
      duration_ms = null
      event = ""
      query_plan = ""
      plan_node = ""
      sql_text = ""

      if is_json(raw) {
        j = parse_json!(raw)
        severity_pg = upcase(string(j.error_severity) ?? "LOG")
        statement = string(j.statement) ?? ""
        msg = string(j.message) ?? raw
        internal_query = string(j.internal_query) ?? ""
        user = string(j.user) ?? ""
        dbname = string(j.dbname) ?? ""
        pid = to_int(j.pid) ?? 0
        application_name = string(j.application_name) ?? ""
        backend_type = string(j.backend_type) ?? ""
        sql_state = string(j.state_code) ?? ""
        detail = string(j.detail) ?? ""
        hint = string(j.hint) ?? ""
        query_id = to_string(j.query_id) ?? ""
        remote_host = string(j.remote_host) ?? ""
        command_tag = string(j.ps) ?? ""
        context = string(j.context) ?? ""
        body = if statement != "" { statement } else { msg }
        sql_text = statement

        if severity_pg == "PANIC" || severity_pg == "FATAL" {
          severity = "FATAL"
          severity_number = 21
        } else if severity_pg == "ERROR" {
          severity = "ERROR"
          severity_number = 17
        } else if severity_pg == "WARNING" {
          severity = "WARN"
          severity_number = 13
        } else if severity_pg == "NOTICE" || severity_pg == "LOG" || severity_pg == "INFO" {
          severity = "INFO"
          severity_number = 9
        } else if severity_pg == "DEBUG" || starts_with(severity_pg, "DEBUG") {
          severity = "DEBUG"
          severity_number = 5
        }

        plan = parse_regex(msg, r'(?s)plan:\s*(?P<plan>.+)$') ?? {}
        query_plan = string(plan.plan) ?? ""
        if query_plan != "" {
          event = "auto_explain"
          pj, perr = parse_json(query_plan)
          if perr == null {
            qt = string(pj."Query Text") ?? ""
            if qt != "" {
              sql_text = qt
              body = qt
            }
            plan_node = string(pj.Plan."Node Type") ?? ""
            qid = to_string(pj."Query Identifier") ?? ""
            if query_id == "" || query_id == "0" {
              query_id = qid
            }
          }
        }

        if sql_text == "" {
          extracted = parse_regex(msg, r'(?i)(?:parse|bind|execute)\s+<[^>]+>:\s*(?P<sql>.+)$') ?? {}
          sql_text = string(extracted.sql) ?? ""
          if sql_text != "" {
            body = sql_text
          }
        }

        dur = parse_regex(msg, r'(?i)(?:duration|продолжительность):\s*(?P<ms>[0-9.]+)\s*(?:ms|мс)') ?? {}
        dms = string(dur.ms) ?? ""
        if dms != "" {
          duration_ms = to_float(dms) ?? null
        }
      }

      . = {
        "timestamp": ts,
        "service": service,
        "source": "jsonlog",
        "severity": severity,
        "severity_number": severity_number,
        "severity_pg": severity_pg,
        "user": user,
        "dbname": dbname,
        "pid": pid,
        "application_name": application_name,
        "backend_type": backend_type,
        "sql_state": sql_state,
        "detail": detail,
        "hint": hint,
        "query_id": query_id,
        "remote_host": remote_host,
        "command_tag": command_tag,
        "internal_query": internal_query,
        "context": context,
        "message": msg,
        "body": body,
        "sql_text": sql_text,
        "duration_ms": duration_ms,
        "event": event,
        "query_plan": query_plan,
        "plan_node": plan_node
      }

  postgres_1c_to_otlp:
    type: remap
    inputs: [postgres_1c_parsed]
    source: |
      ts_ns, ts_err = to_unix_timestamp(.timestamp, unit: "nanoseconds")
      if ts_err != null {
        ts_ns = to_unix_timestamp!(now(), unit: "nanoseconds")
      }
      log_attrs = [
        {"key": "db.system", "value": {"stringValue": "postgresql"}},
        {"key": "com.docker.compose.service", "value": {"stringValue": .service}}
      ]
      fields = {
        "user": .user,
        "dbname": .dbname,
        "pid": to_string(.pid) ?? "",
        "application_name": .application_name,
        "backend_type": .backend_type,
        "state_code": .sql_state,
        "error_severity": .severity_pg,
        "detail": .detail,
        "hint": .hint,
        "query_id": .query_id,
        "remote_host": .remote_host,
        "command_tag": .command_tag,
        "internal_query": .internal_query,
        "context": .context
      }
      for_each(fields) -> |k, v| {
        if v != "" && v != "0" {
          log_attrs = push(log_attrs, {"key": k, "value": {"stringValue": v}})
        }
      }
      if .sql_text != "" && .message != "" && .message != .sql_text {
        log_attrs = push(log_attrs, {"key": "pg_message", "value": {"stringValue": .message}})
      }
      if .query_plan != "" {
        log_attrs = push(log_attrs, {"key": "query_plan", "value": {"stringValue": .query_plan}})
        log_attrs = push(log_attrs, {"key": "event", "value": {"stringValue": "auto_explain"}})
      }
      if .duration_ms != null {
        log_attrs = push(log_attrs, {"key": "duration_ms", "value": {"stringValue": to_string!(.duration_ms)}})
      }
      service = .service
      severity_text = .severity
      severity_number = .severity_number
      body = .body
      . = {
        "resourceLogs": [{
          "resource": {
            "attributes": [
              {"key": "service.name", "value": {"stringValue": service}},
              {"key": "deployment.environment", "value": {"stringValue": "docker"}}
            ]
          },
          "scopeLogs": [{
            "scope": {
              "name": "vector.postgres_jsonlog",
              "version": "1.0.0"
            },
            "logRecords": [{
              "timeUnixNano": ts_ns,
              "severityNumber": severity_number,
              "severityText": severity_text,
              "body": {"stringValue": body},
              "attributes": log_attrs
            }]
          }]
        }]
      }

  postgres_ch_row:
    type: remap
    inputs: [postgres_1c_parsed]
    source: |
      . = {
        "timestamp": .timestamp,
        "service": .service,
        "source": .source,
        "severity": .severity,
        "severity_pg": .severity_pg,
        "user": .user,
        "dbname": .dbname,
        "pid": .pid,
        "application_name": .application_name,
        "backend_type": .backend_type,
        "remote_host": .remote_host,
        "command_tag": .command_tag,
        "query_id": .query_id,
        "sql_state": .sql_state,
        "sql_text": .sql_text,
        "message": .message,
        "duration_ms": .duration_ms,
        "event": .event,
        "query_plan": .query_plan,
        "plan_node": .plan_node,
        "detail": .detail,
        "hint": .hint,
        "context": .context
      }

  postgres_plans:
    type: filter
    inputs: [postgres_ch_row]
    condition: '.event == "auto_explain" && .query_plan != ""'

  postgres_plan_row:
    type: remap
    inputs: [postgres_plans]
    source: |
      duration_ms = 0.0
      if is_float(.duration_ms) {
        duration_ms = .duration_ms
      }
      . = {
        "timestamp": .timestamp,
        "service": .service,
        "user": .user,
        "dbname": .dbname,
        "pid": .pid,
        "application_name": .application_name,
        "command_tag": .command_tag,
        "query_id": .query_id,
        "sql_text": .sql_text,
        "duration_ms": duration_ms,
        "plan_node": .plan_node,
        "query_plan": .query_plan
      }

  postgres_errors:
    type: filter
    inputs: [postgres_ch_row]
    condition: |
      includes(["ERROR", "FATAL", "WARN"], .severity) || includes(["ERROR", "FATAL", "WARNING", "PANIC"], .severity_pg)

  postgres_error_row:
    type: remap
    inputs: [postgres_errors]
    source: |
      . = {
        "timestamp": .timestamp,
        "service": .service,
        "source": .source,
        "severity": .severity,
        "severity_pg": .severity_pg,
        "user": .user,
        "dbname": .dbname,
        "pid": .pid,
        "application_name": .application_name,
        "command_tag": .command_tag,
        "query_id": .query_id,
        "sql_state": .sql_state,
        "sql_text": .sql_text,
        "message": .message,
        "detail": .detail,
        "hint": .hint,
        "context": .context
      }

sinks:
  clickhouse_pg_otlp:
    type: opentelemetry
    inputs: [postgres_1c_to_otlp]
    protocol:
      type: http
      uri: http://clickhouse-db:4318/v1/logs
      method: post
      encoding:
        codec: otlp
      batch:
        max_events: 100
        timeout_secs: 5

  clickhouse_pg_logs:
    type: clickhouse
    inputs: [postgres_ch_row]
    endpoint: ${CLICKHOUSE_ENDPOINT}
    database: postgres
    table: logs
    skip_unknown_fields: true
    date_time_best_effort: true
    compression: gzip
    auth:
      strategy: basic
      user: ${CLICKHOUSE_USERNAME}
      password: ${CLICKHOUSE_PASSWORD}
    batch:
      max_events: 200
      timeout_secs: 5

  clickhouse_pg_plans:
    type: clickhouse
    inputs: [postgres_plan_row]
    endpoint: ${CLICKHOUSE_ENDPOINT}
    database: postgres
    table: query_plans
    skip_unknown_fields: true
    date_time_best_effort: true
    compression: gzip
    auth:
      strategy: basic
      user: ${CLICKHOUSE_USERNAME}
      password: ${CLICKHOUSE_PASSWORD}
    batch:
      max_events: 100
      timeout_secs: 5

  clickhouse_pg_errors:
    type: clickhouse
    inputs: [postgres_error_row]
    endpoint: ${CLICKHOUSE_ENDPOINT}
    database: postgres
    table: errors
    skip_unknown_fields: true
    date_time_best_effort: true
    compression: gzip
    auth:
      strategy: basic
      user: ${CLICKHOUSE_USERNAME}
      password: ${CLICKHOUSE_PASSWORD}
    batch:
      max_events: 50
      timeout_secs: 5
