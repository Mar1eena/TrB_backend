# Подключается из PGDATA/postgresql.conf: include_if_exists = '/etc/pg-config/logging.conf'
# JSON-логи читает vector-pg → ClickStack (clickhouse-pg) → HyperDX :8082
#
# Полный сбор SQL + планов (auto_explain). Нагрузка высокая: каждый запрос
# инструментируется ANALYZE. Для продакшена поднимите пороги duration / sample_rate.

logging_collector = on
log_destination = 'jsonlog'
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d'
log_rotation_age = 1d
log_rotation_size = 100MB
log_truncate_on_rotation = off
log_timezone = 'UTC'
log_error_verbosity = verbose
log_line_prefix = '%m [%p] %q%u@%d '

# Соединения, блокировки, temp, autovacuum
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 0
log_replication_commands = on
log_recovery_conflict_waits = on

# Все SQL с длительностью и параметрами bind
log_min_duration_statement = 0
log_duration = off
log_statement = 'all'
log_parameter_max_length = -1
log_parameter_max_length_on_error = -1

# Планы: грузятся в каждый backend (reload + новые сессии, restart не нужен)
session_preload_libraries = 'auto_explain'
auto_explain.log_min_duration = 0
auto_explain.log_analyze = on
auto_explain.log_buffers = on
auto_explain.log_wal = on
auto_explain.log_timing = on
auto_explain.log_triggers = on
auto_explain.log_verbose = on
auto_explain.log_nested_statements = on
auto_explain.log_settings = on
auto_explain.log_format = json
auto_explain.sample_rate = 1.0
