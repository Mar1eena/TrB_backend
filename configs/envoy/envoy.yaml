admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901
static_resources:
  listeners:
    - name: listener1
      address:
        socket_address: { address: 0.0.0.0, port_value: 8081 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: AUTO
                generate_request_id: true
                preserve_external_request_id: true
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        json_format:
                          message: "http request"
                          duration_ms: "%DURATION%"
                          server_duration_ms: "%RESP(X-ENVOY-UPSTREAM-SERVICE-TIME)%"
                          "peer.addr": "%DOWNSTREAM_REMOTE_ADDRESS%"
                          "client.addr": "%REQ(X-FORWARDED-FOR)%"
                          "http.method": "%REQ(:METHOD)%"
                          "http.path": "%REQ(:PATH)%"
                          "http.status_code": "%RESPONSE_CODE%"
                          "grpc.status": "%GRPC_STATUS%"
                          "upstream.cluster": "%UPSTREAM_CLUSTER%"
                          "upstream.host": "%UPSTREAM_HOST%"
                          user_agent: "%REQ(USER-AGENT)%"
                          bytes_sent: "%BYTES_SENT%"
                          bytes_received: "%BYTES_RECEIVED%"
                          x_request_id: "%REQ(X-REQUEST-ID)%"
                          traceparent: "%REQ(TRACEPARENT)%"
                          trace_id: "%REQ(X-TRACE-ID)%"
                          span_id: "%REQ(X-SPAN-ID)%"
                          "caller.service": "%REQ(X-CALLER-SERVICE)%"
                          "initiator.service": "%REQ(X-INITIATOR-SERVICE)%"
                          "rpc.kind": "http"
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: local_service
                      domains:
                        - "*"
                      typed_per_filter_config:
                        envoy.filters.http.cors:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
                          allow_origin_string_match:
                            - prefix: "http://"
                            - prefix: "https://"
                          allow_methods: GET, PUT, DELETE, POST, PATCH, OPTIONS
                          allow_headers: keep-alive,user-agent,cache-control,content-type,content-transfer-encoding,x-accept-content-transfer-encoding,x-accept-response-streaming,x-user-agent,x-grpc-web,grpc-timeout,authorization,x-request-id,traceparent,tracestate,x-trace-id,x-span-id,x-parent-span-id,x-correlation-id,x-caller-service,x-initiator-service,x-app-name
                          expose_headers: grpc-status,grpc-message,grpc-status-details-bin,x-request-id
                          max_age: "86400"
                      routes:
                        - match:
                            prefix: /tinkoff.public.invest.api.contract.v1.MarketDataStreamService
                          route:
                            cluster: invest
                            timeout: 0s
                            request_mirror_policies:
                              cluster: debuger_grpc
                        - match:
                            prefix: /tinkoff.public.invest.api.contract.v1.OperationsStreamService
                          route:
                            cluster: invest
                            timeout: 0s
                            request_mirror_policies:
                              cluster: debuger_grpc
                        - match:
                            prefix: /tinkoff.public.invest.api.contract.v1.OrdersStreamService
                          route:
                            cluster: invest
                            timeout: 0s
                            request_mirror_policies:
                              cluster: debuger_grpc
                        - match:
                            prefix: /tinkoff.public.invest.api.contract.v1.
                          route:
                            cluster: invest
                            timeout: 60s
                            request_mirror_policies:
                              cluster: debuger_grpc
                        - match:
                            prefix: /trb.nats.manager.public.contract.v1.NatsJetStreamManager
                          route:
                            cluster: nats
                            timeout: 60s
                            request_mirror_policies:
                              cluster: debuger_grpc
                        - match:
                            prefix: /v1/nats
                          route:
                            cluster: nats
                            timeout: 60s
                            request_mirror_policies:
                              cluster: debuger_grpc
                        - match:
                            prefix: /trb.db.api.public.contract.v1.DbApi
                          route:
                            cluster: data
                            timeout: 60s
                            request_mirror_policies:
                              cluster: debuger_grpc
                        - match:
                            prefix: /v1/instruments
                          route:
                            cluster: data
                            timeout: 60s
                            request_mirror_policies:
                              cluster: debuger_grpc
                        - match:
                            prefix: /v1/scheduler
                          route:
                            cluster: data
                            timeout: 60s
                            request_mirror_policies:
                              cluster: debuger_grpc
                        - match:
                            prefix: /v1/historic-candles
                          route:
                            cluster: data
                            timeout: 60s
                            request_mirror_policies:
                              cluster: debuger_grpc
                        - match:
                            prefix: /trb.test.public.contract.v1.Test
                          route:
                            cluster: test
                            timeout: 120s
                            request_mirror_policies:
                              cluster: debuger_grpc
                        - match:
                            prefix: /v1/test
                          route:
                            cluster: test
                            timeout: 120s
                            request_mirror_policies:
                              cluster: debuger_grpc
                        - match:
                            prefix: /trb.clickhouse.manager.public.contract.v1.ClickHouseManager
                          route:
                            cluster: clickhouse
                            timeout: 60s
                            request_mirror_policies:
                              cluster: debuger_grpc
                        - match:
                            prefix: /v1/clickhouse
                          route:
                            cluster: clickhouse
                            timeout: 60s
                            request_mirror_policies:
                              cluster: debuger_grpc
                        - match:
                            prefix: /clickhouse.grpc.ClickHouse
                          route:
                            cluster: clickhouse_grpc
                            timeout: 60s
                            request_mirror_policies:
                              cluster: debuger_grpc
                http_filters:
                  - name: envoy.filters.http.grpc_json_transcoder
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_json_transcoder.v3.GrpcJsonTranscoder
                      proto_descriptor: /etc/envoy/protos/trb_protos.pb
                      services:
                        - tinkoff.public.invest.api.contract.v1.UsersService
                        - tinkoff.public.invest.api.contract.v1.InstrumentsService
                        - tinkoff.public.invest.api.contract.v1.MarketDataService
                        - tinkoff.public.invest.api.contract.v1.MarketDataStreamService
                        - tinkoff.public.invest.api.contract.v1.OperationsService
                        - tinkoff.public.invest.api.contract.v1.OperationsStreamService
                        - tinkoff.public.invest.api.contract.v1.OrdersService
                        - tinkoff.public.invest.api.contract.v1.OrdersStreamService
                        - tinkoff.public.invest.api.contract.v1.SandboxService
                        - tinkoff.public.invest.api.contract.v1.SignalService
                        - tinkoff.public.invest.api.contract.v1.StopOrdersService
                        - trb.nats.manager.public.contract.v1.NatsJetStreamManager
                        - trb.db.api.public.contract.v1.DbApi
                        - trb.test.public.contract.v1.Test
                        - trb.clickhouse.manager.public.contract.v1.ClickHouseManager
                      print_options:
                        add_whitespace: true
                        always_print_primitive_fields: true
                        always_print_enums_as_ints: false
                        preserve_proto_field_names: false
                  - name: envoy.filters.http.grpc_web
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_web.v3.GrpcWeb
                  - name: envoy.filters.http.cors
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: invest
      connect_timeout: 0.25s
      lb_policy: ROUND_ROBIN
      dns_lookup_family: V4_ONLY
      type: STRICT_DNS
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: invest
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: invest
                      port_value: 9091
    - name: nats
      connect_timeout: 0.25s
      lb_policy: ROUND_ROBIN
      dns_lookup_family: V4_ONLY
      type: STRICT_DNS
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: nats
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: nats
                      port_value: 9091
    - name: data
      connect_timeout: 0.25s
      lb_policy: ROUND_ROBIN
      dns_lookup_family: V4_ONLY
      type: STRICT_DNS
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: data
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: data
                      port_value: 9091
    - name: test
      connect_timeout: 0.25s
      lb_policy: ROUND_ROBIN
      dns_lookup_family: V4_ONLY
      type: STRICT_DNS
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: test
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: test
                      port_value: 9091
    - name: clickhouse
      connect_timeout: 0.25s
      lb_policy: ROUND_ROBIN
      dns_lookup_family: V4_ONLY
      type: STRICT_DNS
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: clickhouse
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: clickhouse
                      port_value: 9091
    - name: clickhouse_grpc
      connect_timeout: 0.25s
      lb_policy: ROUND_ROBIN
      dns_lookup_family: V4_ONLY
      type: STRICT_DNS
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: clickhouse_grpc
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: clickhouse-db
                      port_value: 9100
    - name: debuger_grpc
      connect_timeout: 0.25s
      lb_policy: ROUND_ROBIN
      dns_lookup_family: V4_ONLY
      type: STRICT_DNS
      http2_protocol_options: {}
      load_assignment:
        cluster_name: debuger_grpc
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: host.docker.internal
                      port_value: 50051
