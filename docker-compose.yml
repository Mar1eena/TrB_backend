name: trb
version: "3.8"

##################### CONFIG ############################
x-services-config: &services-config
  restart: unless-stopped
  environment:
    - APP_RUNTIME=docker
    - PORT
    - NATS_URL
    - NATS_URL_DOCKER
    - CLICKHOUSE_URL
    - CLICKHOUSE_URL_DOCKER
    - CLICKHOUSE_DATABASE
    - CLICKHOUSE_USER
    - CLICKHOUSE_USERNAME
    - CLICKHOUSE_PASSWORD
    - CLICKHOUSE_DEBUG
    - CLICKHOUSE_READ_TIMEOUT_SEC
    - REDIS_URL
    - REDIS_URL_DOCKER
    - REDIS_USER
    - REDIS_PASSWORD
    - KAFKA_BROKERS_ADDRESS
    - INVEST_TOKEN
    - INVEST_ENDPOINT
    - INVEST_ACCOUNT_ID
    - INVEST_APP_NAME
    - INVEST_API_URL
    - INVEST_API_URL_DOCKER
    - POSTGRE_API_URL
    - POSTGRE_API_URL_DOCKER
    - CLICKHOUSE_API_URL
    - CLICKHOUSE_API_URL_DOCKER
    - INTERVAL_UPDATE_HC
    - HCT_NATS_STREAM
    - HCT_NATS_SUBJECT
    - HCT_NATS_CONSUMER
    - HCT_ORCH_SUBJECT_PREFIX
    - HCT_ORCH_TICK_SEC
    - HCT_ORCH_MIN_LAG_SEC
    - HCT_ORCH_MAX_PER_TICK
    - HCT_ORCH_INTERVAL
    - HCT_ORCH_UIDS
    - POSTGRES_URL
    - POSTGRES_URL_DOCKER
    - POSTGRES_URL_CLICKHOUSE
    - POSTGRES_CLICKHOUSE_NAMED_COLLECTION
    - POSTGRES_USER
    - POSTGRES_PASSWORD
    - POSTGRES_DB
    - POSTGRES_EXTRA_CONNECTIONS
    - POSTGRES_EXTRA_CONNECTIONS_DOCKER
    - POSTGRES_CONNECTION_NAME
    - CLICKHOUSE_EXTRA_CONNECTIONS
    - CLICKHOUSE_EXTRA_CONNECTIONS_DOCKER
    - CLICKHOUSE_CONNECTION_NAME
  deploy:
    resources:
      limits:
        cpus: '1'
        memory: 128M
      reservations:
        memory: 64M
  command: ["/app/service"]
  volumes:
    - ./.env:/app/.env
  networks:
    - TrB_Network
  logging:
    # json-file → Vector → OTLP :4318 → ClickStack collector → otel_* → HyperDX
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

x-go-build: &go-build
  context: .
  dockerfile: ./build/docker/services/go/Dockerfile

##################### CONFIG ############################

services:
  ############################# SERVICES #############################
  historiccandle:
    <<: [*services-config]
    container_name: trb-historiccandle
    image: historiccandle:latest
    depends_on:
      - clickhouse-db
      - invest
      - nats-server

  invest:
    <<: [*services-config]
    container_name: trb-invest
    image: invest:latest
    build:
      <<: *go-build
      args:
        CMD_PATH: ./internal/services/invest/cmd/main.go

  nats:
    <<: [*services-config]
    container_name: trb-nats
    image: nats-api:latest
    build:
      <<: *go-build
      args:
        CMD_PATH: ./internal/services/nats/cmd/main.go
    depends_on:
      - nats-server

  postgre:
    <<: [*services-config]
    container_name: trb-postgre
    image: postgre:latest
    build:
      <<: *go-build
      args:
        CMD_PATH: ./internal/services/postgre/cmd/main.go
    depends_on:
      clickhouse-db:
        condition: service_healthy
      postgre-db:
        condition: service_healthy
      # postgre-1c-db:
      #   condition: service_healthy

  test:
    <<: [*services-config]
    container_name: trb-test
    image: test:latest
    build:
      <<: *go-build
      args:
        CMD_PATH: ./internal/services/test/cmd/main.go
    depends_on:
      - invest
      - clickhouse
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
        reservations:
          memory: 64M

  indicators-manage:
    <<: [*services-config]
    container_name: trb-indicators-manage
    image: indicators-manage:latest
    build:
      <<: *go-build
      args:
        CMD_PATH: ./internal/services/indicators/manage/cmd/main.go
    environment:
      - APP_RUNTIME=docker
      - PORT=9093
      - INDICATORS_PORT=9093
      - NATS_URL
      - NATS_URL_DOCKER
      - CLICKHOUSE_URL
      - CLICKHOUSE_URL_DOCKER
      - CLICKHOUSE_DATABASE
      - CLICKHOUSE_USER
      - CLICKHOUSE_USERNAME
      - CLICKHOUSE_PASSWORD
    ports:
      - "9093:9093"
    depends_on:
      - clickhouse-db
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
        reservations:
          memory: 64M

  indicators-calculation:
    <<: [*services-config]
    container_name: trb-indicators-calculation
    image: indicators-calculation:latest
    build:
      context: .
      dockerfile: ./build/docker/services/indicators/Dockerfile
    command: ["python", "/app/main.py"]
    environment:
      - APP_RUNTIME=docker
      - INDICATORS_NATS_SUBJECT=TrB.indicators.tasks
      - NATS_URL
      - NATS_URL_DOCKER
      - CLICKHOUSE_URL
      - CLICKHOUSE_URL_DOCKER
      - CLICKHOUSE_DATABASE
      - CLICKHOUSE_USER
      - CLICKHOUSE_USERNAME
      - CLICKHOUSE_PASSWORD
    depends_on:
      - clickhouse-db
      - nats-server
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2048M
        reservations:
          memory: 128M

  clickhouse:
    <<: [*services-config]
    container_name: trb-clickhouse
    image: clickhouse-api:latest
    build:
      <<: *go-build
      args:
        CMD_PATH: ./internal/services/clickhouse/cmd/main.go
    depends_on:
      clickhouse-db:
        condition: service_healthy

  ############################# ENVOY #############################
  envoy:
    image: envoy:latest
    container_name: trb-envoy
    build:
      context: .
      dockerfile: ./build/docker/envoy/Dockerfile
      args:
        ENVOY_IMAGE: ${ENVOY_IMAGE:-envoyproxy/envoy}
        ENVOY_VARIANT: ${ENVOY_VARIANT:-v1.36.4}
        ENVOY_CONFIG: ./configs/envoy/envoy.yaml
    restart: unless-stopped
    environment:
      - KAFKA_BROKERS_ADDRESS
      - NATS_URL_DOCKER
    ports:
      - '8081:8081'
      - '9901:9901'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./configs/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ../TrB_proto/gen/desc/trb_protos.pb:/etc/envoy/protos/trb_protos.pb:ro
    depends_on:
      - nats
      - postgre
      - clickhouse
      - invest
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          memory: 48M
    networks:
      - TrB_Network
  #################################################################

  ############################## DB  ##########################################
  clickhouse-db:
    image: clickhouse/clickstack-all-in-one:latest
    container_name: trb-clickhouse-db
    ports:
      - 4317:4317
      - 4318:4318
      - 8080:8080
      - 8123:8123
      - 9000:9000
      - 9009:9009
      - 9100:9100
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-TrB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USERNAME:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-default}
      IS_OSS: "true"
      # HyperDX → ClickHouse: пароль обязателен (в образе default/default, не пустой)
      DEFAULT_CONNECTIONS: '[{"name":"Local ClickHouse","host":"http://127.0.0.1:8123","username":"${CLICKHOUSE_USERNAME:-default}","password":"${CLICKHOUSE_PASSWORD:-default}"}]'
      DEFAULT_SOURCES: '[{"from":{"databaseName":"default","tableName":"otel_logs"},"kind":"log","timestampValueExpression":"Timestamp","name":"Logs","displayedTimestampValueExpression":"Timestamp","implicitColumnExpression":"Body","serviceNameExpression":"ServiceName","bodyExpression":"Body","eventAttributesExpression":"LogAttributes","resourceAttributesExpression":"ResourceAttributes","defaultTableSelectExpression":"Timestamp,ServiceName,SeverityText,Body","severityTextExpression":"SeverityText","traceIdExpression":"TraceId","spanIdExpression":"SpanId","connection":"Local ClickHouse"},{"from":{"databaseName":"techlog","tableName":"events"},"kind":"log","timestampValueExpression":"timestamp","name":"1C Techlog","displayedTimestampValueExpression":"timestamp","implicitColumnExpression":"raw","serviceNameExpression":"process","bodyExpression":"raw","defaultTableSelectExpression":"timestamp,event,severity,process,usr,duration_ms,context","severityTextExpression":"severity","connection":"Local ClickHouse"},{"from":{"databaseName":"postgres","tableName":"logs"},"kind":"log","timestampValueExpression":"timestamp","name":"PostgreSQL 1C","displayedTimestampValueExpression":"timestamp","implicitColumnExpression":"message","serviceNameExpression":"service","bodyExpression":"sql_text","defaultTableSelectExpression":"timestamp,service,severity,dbname,user,duration_ms,sql_text","severityTextExpression":"severity","connection":"Local ClickHouse"}]'
    volumes:
      - clickhouse_data:/var/lib/clickhouse  # таблицы ClickHouse
      - hyperdx_data:/data/db                # MongoDB HyperDX: дашборды, alerts, saved searches
      - ./volumes/clickhouse/log:/var/log
      - ./configs/clickhouse/config.d/config.xml:/etc/clickhouse-server/config.d/config.xml:ro
      - ./configs/clickhouse/config.d/memory.xml:/etc/clickhouse-server/config.d/memory.xml:ro
      - ./configs/clickhouse/config.d/named-collection-trb.xml:/etc/clickhouse-server/config.d/named-collection-trb.xml:ro
      - ./configs/clickhouse/users.d/zz-admin-default.xml:/etc/clickhouse-server/users.d/zz-admin-default.xml:ro
      - ./configs/clickhouse/format_schemas:/etc/clickhouse-server/format_schemas
      # HyperDX proxy: не смешивать Authorization + X-ClickHouse-* (см. hyperdx#962)
      - ./configs/clickhouse/hyperdx/clickhouseProxy.js:/app/packages/api/build/routers/api/clickhouseProxy.js:ro
      # HyperDX MCP / API v2: в Local App Mode нет Personal API Access Key (hyperdx#1222)
      - ./configs/clickhouse/hyperdx/auth.js:/app/packages/api/build/middleware/auth.js:ro
      # HyperDX без регистрации: stock entry.sh форсирует REQUIRED_AUTH
      - ./configs/clickhouse/hyperdx/entry.sh:/etc/local/entry.sh:ro
      - ./backups/clickhouse:/backups
    # user: "101:101"
    networks:
      TrB_Network:
        aliases:
          - clickhouse-db
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:8123/ping",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 12G
        reservations:
          memory: 8G

  # https://github.com/ClickHouse/mcp-clickhouse
  # HTTP MCP: http://127.0.0.1:8000/mcp  health: http://127.0.0.1:8000/health
  mcp-clickhouse:
    image: ghcr.io/clickhouse/mcp-clickhouse:latest
    container_name: trb-mcp-clickhouse
    restart: unless-stopped
    depends_on:
      clickhouse-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      CLICKHOUSE_HOST: clickhouse-db
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USERNAME:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-default}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-TrB}
      CLICKHOUSE_SECURE: "false"
      CLICKHOUSE_VERIFY: "false"
      CLICKHOUSE_CONNECT_TIMEOUT: 30
      CLICKHOUSE_SEND_RECEIVE_TIMEOUT: 300
      CLICKHOUSE_ALLOW_WRITE_ACCESS: ${CLICKHOUSE_ALLOW_WRITE_ACCESS:-true}
      CLICKHOUSE_ALLOW_DROP: ${CLICKHOUSE_ALLOW_DROP:-false}
      CLICKHOUSE_MCP_SERVER_TRANSPORT: http
      CLICKHOUSE_MCP_BIND_HOST: "0.0.0.0"
      CLICKHOUSE_MCP_BIND_PORT: "8000"
      CLICKHOUSE_MCP_AUTH_DISABLED: ${CLICKHOUSE_MCP_AUTH_DISABLED:-true}
    networks:
      TrB_Network:
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          memory: 128M

  postgre-db:
    image: postgres:16-alpine
    container_name: trb-postgre-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-trb}
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=768MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "log_min_duration_statement=200"
      - "-c"
      - "log_checkpoints=on"
      - "-c"
      - "log_connections=on"
      - "-c"
      - "log_disconnections=on"
      - "-c"
      - "log_lock_waits=on"
      - "-c"
      - "log_temp_files=0"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ${POSTGRES_DATA_PATH:-./volumes/postgres}:/var/lib/postgresql/data
      - ./configs/postgres/init.d:/docker-entrypoint-initdb.d:ro
    networks:
      TrB_Network:
        aliases:
          - postgre-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-trb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G
        reservations:
          memory: 256M
  
  # postgre-1c-db:
  #   image: postgre-1c-db:latest
  #   container_name: postgre-1c-db
  #   hostname: postgre1c
  #   build:
  #     context: ./build/docker/postgre-1c-db
  #     dockerfile: Dockerfile
  #   command:
  #     - "postgres"
  #     - "-c"
  #     - "listen_addresses=*"
  #     - "-c"
  #     - "max_connections=50"
  #     - "-c"
  #     - "shared_buffers=1GB"
  #     - "-c"
  #     - "effective_cache_size=3GB"
  #     - "-c"
  #     - "work_mem=16MB"
  #     - "-c"
  #     - "maintenance_work_mem=256MB"
  #     - "-c"
  #     - "random_page_cost=1.1"
  #     - "-c"
  #     - "temp_file_limit=10GB"
  #     - "-c"
  #     - "idle_in_transaction_session_timeout=10s"
  #     - "-c"
  #     - "lock_timeout=1s"
  #     - "-c"
  #     - "statement_timeout=60s"
  #   environment:
  #     POSTGRES_HOST: postgres
  #     POSTGRES_DB: ${POSTGRES_1C_DB:-TrB_DB}
  #     POSTGRES_USER: ${POSTGRES_1C_USER:-admin}
  #     POSTGRES_PASSWORD: ${POSTGRES_1C_PASSWORD:-1984}
  #     PGDATA: "/var/lib/pgpro/1c-17/data"
  #   logging:
  #     driver: "json-file"
  #     options:
  #       max-size: "10m"
