  #   networks:
  #     TrB_Network:

  ################################################################################

  ############################## NATS  ##########################################
  nats-server:
    image: nats:latest
    container_name: trb-nats-server
    restart: unless-stopped
    ports:
      - "4222:4222"
      - "6222:6222"
      - "8222:8222"
    volumes:
      - ./configs/nats-server/nats-server.conf:/nats-server.conf
      - ./volumes/jetstream:/jetstream
    command: -c /nats-server.conf --js --sd /jetstream -p 4222 -m 8222
    networks:
      TrB_Network:
        aliases:
          - nats-server
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 64M

  #####################################################################################

  ############################## MONITORING  ##########################################
  # Docker logs + 1C techlog + PostgreSQL jsonlog → clickhouse-db (HyperDX :8080)
  vector:
    image: timberio/vector:0.51.1-alpine
    container_name: trb-vector
    hostname: vector
    restart: unless-stopped
    command: ["--config", "/etc/vector/vector.yaml", "--config", "/etc/vector/postgres.yaml", "--config", "/etc/vector/techlog.yaml"]
    environment:
      TZ: ${SYSTEM_TIMEZONE:-Europe/Moscow}
      CLICKHOUSE_ENDPOINT: http://clickhouse-db:8123
      CLICKHOUSE_USERNAME: ${CLICKHOUSE_USERNAME:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-default}
    volumes:
      - ./configs/vector/vector.yaml:/etc/vector/vector.yaml:ro
      - ./configs/vector/postgres.yaml:/etc/vector/postgres.yaml:ro
      - ./configs/vector/techlog.yaml:/etc/vector/techlog.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${POSTGRES_1C_LOG_PATH:-./volumes/postgre-1c-db/log}:/var/log/postgresql-1c:ro
      - ${ONEC_TECHLOG_PATH:-./volumes/1c-techlog}:/var/log/1c-techlog:ro
      - vector_data:/var/lib/vector
    ports:
      - "8686:8686"
    depends_on:
      clickhouse-db:
        condition: service_healthy
      # postgre-1c-db:
      #   condition: service_started
      postgre-db:
        condition: service_started
    networks:
      TrB_Network:
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 768M
        reservations:
          memory: 192M
###############################################################################
volumes:
  clickhouse_data:
  hyperdx_data:
  vector_data:
  postgrespro-1c-data:

networks:
  TrB_Network:
    driver: bridge