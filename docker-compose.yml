name: trb
version: "3.8"

##################### CONFIG ############################
x-services-config: &services-config
  restart: unless-stopped
  environment:
    - APP_RUNTIME=docker
    - PORT
    - NATS_URL
    - NATS_URL_DOCKER
    - CLICKHOUSE_URL
    - CLICKHOUSE_URL_DOCKER
    - CLICKHOUSE_DATABASE
    - CLICKHOUSE_USER
    - CLICKHOUSE_USERNAME
    - CLICKHOUSE_PASSWORD
    - CLICKHOUSE_DEBUG
    - CLICKHOUSE_READ_TIMEOUT_SEC
    - REDIS_URL
    - REDIS_URL_DOCKER
    - REDIS_USER
    - REDIS_PASSWORD
    - KAFKA_BROKERS_ADDRESS
    - INVEST_TOKEN
    - INVEST_ENDPOINT
    - INVEST_ACCOUNT_ID
    - INVEST_APP_NAME
    - INVEST_API_URL
    - INVEST_API_URL_DOCKER
    - POSTGRE_API_URL
    - POSTGRE_API_URL_DOCKER
    - CLICKHOUSE_API_URL
    - CLICKHOUSE_API_URL_DOCKER
    - INTERVAL_UPDATE_HC
    - HCT_NATS_STREAM
    - HCT_NATS_SUBJECT
    - HCT_NATS_CONSUMER
    - HCT_ORCH_SUBJECT_PREFIX
    - HCT_ORCH_TICK_SEC
    - HCT_ORCH_MIN_LAG_SEC
    - HCT_ORCH_MAX_PER_TICK
    - HCT_ORCH_INTERVAL
    - HCT_ORCH_UIDS
    - POSTGRES_URL
    - POSTGRES_URL_DOCKER
    - POSTGRES_URL_CLICKHOUSE
    - POSTGRES_CLICKHOUSE_NAMED_COLLECTION
    - POSTGRES_USER
    - POSTGRES_PASSWORD
    - POSTGRES_DB
    - POSTGRES_EXTRA_CONNECTIONS
    - POSTGRES_EXTRA_CONNECTIONS_DOCKER
    - POSTGRES_CONNECTION_NAME
    - CLICKHOUSE_EXTRA_CONNECTIONS
    - CLICKHOUSE_EXTRA_CONNECTIONS_DOCKER
    - CLICKHOUSE_CONNECTION_NAME
  deploy:
    resources:
      limits:
        cpus: '1'
        memory: 256M
  command: ["/app/service"]
  volumes:
    - ./.env:/app/.env
  networks:
    - TrB_Network
  logging:
    # json-file → Vector → OTLP :4318 → ClickStack collector → otel_* → HyperDX
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

x-go-build: &go-build
  context: .
  dockerfile: ./build/docker/services/go/Dockerfile

##################### CONFIG ############################

services:
  ############################# SERVICES #############################
  historiccandle:
    <<: [*services-config]
    container_name: trb-historiccandle
    image: historiccandle:latest
    depends_on:
      - clickhouse-db
      - invest
      - nats-server

  historiccandle_scheduler:
    <<: [*services-config]
    container_name: trb-historiccandle_scheduler
    image: historiccandle-scheduler:latest
    depends_on:
      - nats-server
      - clickhouse-db
      - postgre-db

  invest:
    <<: [*services-config]
    container_name: trb-invest
    image: invest:latest
    build:
      <<: *go-build
      args:
        CMD_PATH: ./internal/services/invest/cmd/main.go

  nats:
    <<: [*services-config]
    container_name: trb-nats
    image: nats-api:latest
    build:
      <<: *go-build
      args:
        CMD_PATH: ./internal/services/nats/cmd/main.go
    depends_on:
      - nats-server

  postgre:
    <<: [*services-config]
    container_name: trb-postgre
    image: postgre:latest
    build:
      <<: *go-build
      args:
        CMD_PATH: ./internal/services/postgre/cmd/main.go
    depends_on:
      clickhouse-db:
        condition: service_healthy
      postgre-db:
        condition: service_healthy
      postgre-1c-db:
        condition: service_healthy

  test:
    <<: [*services-config]
    container_name: trb-test
    image: test:latest
    build:
      <<: *go-build
      args:
        CMD_PATH: ./internal/services/test/cmd/main.go
    depends_on:
      - invest
      - clickhouse
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  clickhouse:
    <<: [*services-config]
    container_name: trb-clickhouse
    image: clickhouse-api:latest
    build:
      <<: *go-build
      args:
        CMD_PATH: ./internal/services/clickhouse/cmd/main.go
    depends_on:
      clickhouse-db:
        condition: service_healthy
      clickhouse-pg:
        condition: service_healthy

  ############################# ENVOY #############################
  envoy:
    image: envoy:latest
    container_name: trb-envoy
    build:
      context: .
      dockerfile: ./build/docker/envoy/Dockerfile
      args:
        ENVOY_IMAGE: ${ENVOY_IMAGE:-envoyproxy/envoy}
        ENVOY_VARIANT: ${ENVOY_VARIANT:-v1.36.4}
        ENVOY_CONFIG: ./configs/envoy/envoy.yaml
        TRB_PROTO_REF: ${TRB_PROTO_REF:-main}
    restart: unless-stopped
    environment:
      - KAFKA_BROKERS_ADDRESS
      - NATS_URL_DOCKER
    ports:
      - '8081:8081'
      - '9901:9901'
    volumes:
      - ./configs/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    depends_on:
      - nats
      - postgre
      - clickhouse
      - invest
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    networks:
      - TrB_Network
  #################################################################

  ############################## DB  ##########################################
  clickhouse-db:
    image: clickhouse/clickstack-all-in-one:latest
    container_name: trb-clickhouse-db
    ports:
      - 4317:4317
      - 4318:4318
      - 8080:8080
      - 8123:8123
      - 9000:9000
      - 9009:9009
      - 9100:9100
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-TrB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USERNAME:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-default}
      IS_OSS: "true"
      # HyperDX → ClickHouse: пароль обязателен (в образе default/default, не пустой)
      DEFAULT_CONNECTIONS: '[{"name":"Local ClickHouse","host":"http://127.0.0.1:8123","username":"${CLICKHOUSE_USERNAME:-default}","password":"${CLICKHOUSE_PASSWORD:-default}"}]'
      DEFAULT_SOURCES: '[{"from":{"databaseName":"default","tableName":"otel_logs"},"kind":"log","timestampValueExpression":"Timestamp","name":"Logs","displayedTimestampValueExpression":"Timestamp","implicitColumnExpression":"Body","serviceNameExpression":"ServiceName","bodyExpression":"Body","eventAttributesExpression":"LogAttributes","resourceAttributesExpression":"ResourceAttributes","defaultTableSelectExpression":"Timestamp,ServiceName,SeverityText,Body","severityTextExpression":"SeverityText","traceIdExpression":"TraceId","spanIdExpression":"SpanId","connection":"Local ClickHouse"}]'
    volumes:
      - clickhouse_data:/var/lib/clickhouse  # таблицы ClickHouse
      - hyperdx_data:/data/db                # MongoDB HyperDX: дашборды, alerts, saved searches
      - ./volumes/clickhouse/log:/var/log
      - ./configs/clickhouse/config.d/config.xml:/etc/clickhouse-server/config.d/config.xml:ro
      - ./configs/clickhouse/config.d/named-collection-trb.xml:/etc/clickhouse-server/config.d/named-collection-trb.xml:ro
      - ./configs/clickhouse/users.d/zz-admin-default.xml:/etc/clickhouse-server/users.d/zz-admin-default.xml:ro
      - ./configs/clickhouse/format_schemas:/etc/clickhouse-server/format_schemas
      # HyperDX proxy: не смешивать Authorization + X-ClickHouse-* (см. hyperdx#962)
      - ./configs/clickhouse/hyperdx/clickhouseProxy.js:/app/packages/api/build/routers/api/clickhouseProxy.js:ro
      # HyperDX MCP / API v2: в Local App Mode нет Personal API Access Key (hyperdx#1222)
      - ./configs/clickhouse/hyperdx/auth.js:/app/packages/api/build/middleware/auth.js:ro
      # HyperDX без регистрации: stock entry.sh форсирует REQUIRED_AUTH
      - ./configs/clickhouse/hyperdx/entry.sh:/etc/local/entry.sh:ro
      - ./backups/clickhouse:/backups
    # user: "101:101"
    networks:
      TrB_Network:
        aliases:
          - clickhouse-db
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:8123/ping",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: '8G'

  # https://github.com/ClickHouse/mcp-clickhouse
  # HTTP MCP: http://127.0.0.1:8000/mcp  health: http://127.0.0.1:8000/health
  mcp-clickhouse:
    image: ghcr.io/clickhouse/mcp-clickhouse:latest
    container_name: trb-mcp-clickhouse
    restart: unless-stopped
    depends_on:
      clickhouse-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      CLICKHOUSE_HOST: clickhouse-db
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USERNAME:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-default}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-TrB}
      CLICKHOUSE_SECURE: "false"
      CLICKHOUSE_VERIFY: "false"
      CLICKHOUSE_CONNECT_TIMEOUT: 30
      CLICKHOUSE_SEND_RECEIVE_TIMEOUT: 300
      CLICKHOUSE_ALLOW_WRITE_ACCESS: ${CLICKHOUSE_ALLOW_WRITE_ACCESS:-true}
      CLICKHOUSE_ALLOW_DROP: ${CLICKHOUSE_ALLOW_DROP:-false}
      CLICKHOUSE_MCP_SERVER_TRANSPORT: http
      CLICKHOUSE_MCP_BIND_HOST: "0.0.0.0"
      CLICKHOUSE_MCP_BIND_PORT: "8000"
      CLICKHOUSE_MCP_AUTH_DISABLED: ${CLICKHOUSE_MCP_AUTH_DISABLED:-true}
    networks:
      TrB_Network:
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  postgre-db:
    image: postgres:16-alpine
    container_name: trb-postgre-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-trb}
    command:
      - "postgres"
      - "-c"
      - "log_min_duration_statement=200"
      - "-c"
      - "log_checkpoints=on"
      - "-c"
      - "log_connections=on"
      - "-c"
      - "log_disconnections=on"
      - "-c"
      - "log_lock_waits=on"
      - "-c"
      - "log_temp_files=0"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ${POSTGRES_DATA_PATH:-./volumes/postgres}:/var/lib/postgresql/data
      - ./configs/postgres/init.d:/docker-entrypoint-initdb.d:ro
    networks:
      TrB_Network:
        aliases:
          - postgre-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-trb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G
  
  postgre-1c-db:
    image: postgre-1c-db:latest
    container_name: postgre-1c-db
    hostname: postgre1c
    build:
      context: ./build/docker/postgre-1c-db
      dockerfile: Dockerfile
    command:
      - "postgres"
      - "-c"
      - "listen_addresses=*"
      - "-c"
      - "max_connections=50"
      - "-c"
      - "shared_buffers=1GB"
      - "-c"
      - "effective_cache_size=4GB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=512MB"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "temp_file_limit=10GB"
      - "-c"
      - "idle_in_transaction_session_timeout=10s"
      - "-c"
      - "lock_timeout=1s"
      - "-c"
      - "statement_timeout=60s"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_1C_DB:-TrB_DB}
      POSTGRES_USER: ${POSTGRES_1C_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_1C_PASSWORD:-1984}
      PGDATA: "/var/lib/pgpro/1c-17/data"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - postgrespro-1c-data:/var/lib/pgpro/1c-17/data
      - ${POSTGRES_1C_LOG_PATH:-./volumes/postgre-1c-db/log}:/var/log/postgresql
      - ./configs/postgre-1c-db:/etc/pg-config:ro
    ports:
      - "5435:5432"
    healthcheck:
      # TCP, иначе peer по unix-сокету как root сыпет FATAL в лог каждые 10s
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER:-admin} -d $${POSTGRES_DB:-TrB_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 4G
    networks:
      TrB_Network:

  ################################################################################

  ############################## NATS  ##########################################
  nats-server:
    image: nats:latest
    container_name: trb-nats-server
    restart: unless-stopped
    ports:
      - "4222:4222"
      - "6222:6222"
      - "8222:8222"
    volumes:
      - ./configs/nats-server/nats-server.conf:/nats-server.conf
      - ./volumes/jetstream:/jetstream
    command: -c /nats-server.conf --js --sd /jetstream -p 4222 -m 8222
    networks:
      TrB_Network:
        aliases:
          - nats-server
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  #####################################################################################

  ############################## MONITORING  ##########################################
  # Логи PostgreSQL (jsonlog + docker) → отдельный ClickStack / HyperDX :8082
  clickhouse-pg:
    image: clickhouse/clickstack-all-in-one:latest
    container_name: trb-clickhouse-pg
    restart: unless-stopped
    ports:
      - "8082:8080"
      - "8124:8123"
      - "9001:9000"
      - "4319:4317"
      - "4320:4318"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: ${CLICKHOUSE_PG_USERNAME:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PG_PASSWORD:-default}
      IS_OSS: "true"
      DEFAULT_CONNECTIONS: '[{"name":"Local ClickHouse","host":"http://127.0.0.1:8123","username":"${CLICKHOUSE_PG_USERNAME:-default}","password":"${CLICKHOUSE_PG_PASSWORD:-default}"}]'
      DEFAULT_SOURCES: '[{"from":{"databaseName":"default","tableName":"otel_logs"},"kind":"log","timestampValueExpression":"Timestamp","name":"PostgreSQL Logs","displayedTimestampValueExpression":"Timestamp","implicitColumnExpression":"Body","serviceNameExpression":"ServiceName","bodyExpression":"Body","eventAttributesExpression":"LogAttributes","resourceAttributesExpression":"ResourceAttributes","defaultTableSelectExpression":"Timestamp,ServiceName,SeverityText,Body","severityTextExpression":"SeverityText","traceIdExpression":"TraceId","spanIdExpression":"SpanId","connection":"Local ClickHouse"}]'
    volumes:
      - clickhouse_pg_data:/var/lib/clickhouse
      - hyperdx_pg_data:/data/db
      - ./volumes/clickhouse-pg/log:/var/log
      - ./configs/clickhouse/hyperdx/clickhouseProxy.js:/app/packages/api/build/routers/api/clickhouseProxy.js:ro
      - ./configs/clickhouse/hyperdx/auth.js:/app/packages/api/build/middleware/auth.js:ro
      - ./configs/clickhouse/hyperdx/entry.sh:/etc/local/entry.sh:ro
    networks:
      TrB_Network:
        aliases:
          - clickhouse-pg
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:8123/ping",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G

  vector-pg:
    image: timberio/vector:0.51.1-alpine
    container_name: trb-vector-pg
    hostname: vector-pg
    restart: unless-stopped
    command: ["--config", "/etc/vector/postgres.yaml"]
    environment:
      TZ: ${SYSTEM_TIMEZONE:-Europe/Moscow}
      CLICKHOUSE_PG_ENDPOINT: http://clickhouse-pg:8123
      CLICKHOUSE_PG_USERNAME: ${CLICKHOUSE_PG_USERNAME:-default}
      CLICKHOUSE_PG_PASSWORD: ${CLICKHOUSE_PG_PASSWORD:-default}
    volumes:
      - ./configs/vector/postgres.yaml:/etc/vector/postgres.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${POSTGRES_1C_LOG_PATH:-./volumes/postgre-1c-db/log}:/var/log/postgresql-1c:ro
      - vector_pg_data:/var/lib/vector
    ports:
      - "8687:8686"
    depends_on:
      clickhouse-pg:
        condition: service_healthy
      postgre-1c-db:
        condition: service_started
      postgre-db:
        condition: service_started
    networks:
      TrB_Network:
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # Логи сервисов: Vector (docker logs) → OTLP :4318 → ClickStack collector → otel_* → HyperDX
  vector:
    image: timberio/vector:0.51.1-alpine
    container_name: trb-vector
    hostname: vector
    restart: unless-stopped
    command: ["--config", "/etc/vector/vector.yaml"]
    environment:
      TZ: ${SYSTEM_TIMEZONE:-Europe/Moscow}
    volumes:
      - ./configs/vector/vector.yaml:/etc/vector/vector.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - vector_data:/var/lib/vector
    ports:
      - "8686:8686"
    depends_on:
      clickhouse-db:
        condition: service_healthy
    networks:
      TrB_Network:
###############################################################################
volumes:
  clickhouse_data:
  hyperdx_data:
  vector_data:
  clickhouse_pg_data:
  hyperdx_pg_data:
  vector_pg_data:
  postgrespro-1c-data:

networks:
  TrB_Network:
    driver: bridge